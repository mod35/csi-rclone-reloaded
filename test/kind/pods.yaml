apiVersion: apps/v1
kind: Deployment
metadata: {name: consumer, namespace: default}
spec:
  replicas: 4           # 4 pods, all on the worker, all sharing ONE PVC
  selector: {matchLabels: {app: consumer}}
  template:
    metadata: {labels: {app: consumer}}
    spec:
      nodeSelector: {kubernetes.io/hostname: csi-rclone-test-worker}
      containers:
        - name: c
          image: alpine:3.19
          command: ["sh","-c","sleep 100000"]
          volumeMounts:
            - {mountPath: /data, name: media}
      volumes:
        - {name: media, persistentVolumeClaim: {claimName: rclone-test-pvc}}
